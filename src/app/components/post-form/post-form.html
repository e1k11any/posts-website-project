<div class="row justify-content-center py-5">
  <div class="col-md-8">
    <div class="form-container">
      <div class="text-center mb-4">
        <i class="bi bi-pencil-square form-title-icon"></i>
        <h3 class="fw-bold mt-2">
          {{ isEditMode ? 'Edit Your Post' : 'Create a New Post' }}
        </h3>
        <p class="text-muted">Share your thoughts with the world.</p>
      </div>

      <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
        <div class="form-floating mb-4">
          <input
            type="text"
            class="form-control"
            id="title"
            placeholder="Enter title"
            formControlName="title"
          />
          <label for="title">Title</label>
        </div>

        <div class="form-floating mb-4">
          <textarea
            class="form-control"
            id="body"
            placeholder="Write your story here..."
            style="height: 150px"
            formControlName="body"
          ></textarea>
          <label for="body">Body</label>
        </div>

        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-gradient shadow-sm" [disabled]="postForm.invalid">
            <i class="bi bi-check-circle-fill me-2"></i>
            {{ isEditMode ? 'Update Post' : 'Submit Post' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
