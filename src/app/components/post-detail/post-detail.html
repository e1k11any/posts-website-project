<div *ngIf="post; else loading" class="container mt-4 mb-5">
  <div class="mb-4">
    <a routerLink="/" class="btn btn-link text-secondary text-decoration-none">
      <i class="bi bi-arrow-left-circle-fill me-2"></i>Back to All Posts
    </a>
  </div>

  <div
    class="post-header-container shadow-lg"
    [style.backgroundImage]="'url(https://picsum.photos/seed/' + post.id + '/1600/900)'"
  >
    <div class="glass-pane p-4 p-md-5">
      <h1 class="display-4 fw-bolder post-title text-white text-center mb-4">{{ post.title }}</h1>

      <div class="bg-white p-4 rounded-3 shadow-sm">
        <div class="post-meta d-flex align-items-center mb-4 pt-3">
          <img
            src="https://i.pravatar.cc/50?u={{ post.userId }}"
            class="rounded-circle me-3"
            alt="author avatar"
          />
          <div>
            <div class="fw-bold">User {{ post.userId }}</div>
            <div class="text-muted small">Published on September 18, 2025</div>
          </div>
        </div>

        <div class="post-body fs-5 lh-lg">
          <p style="white-space: pre-wrap">{{ post.body }}</p>
        </div>

        <ng-container *ngIf="isLoggedIn$ | async">
          <div class="d-flex justify-content-end mt-4 border-top pt-3">
            <a
              [routerLink]="['/post/edit', post.id]"
              class="btn btn-outline-secondary rounded-pill me-2"
            >
              <i class="bi bi-pencil-fill me-1"></i> Edit
            </a>
            <button (click)="onDelete()" class="btn btn-outline-danger rounded-pill">
              <i class="bi bi-trash-fill me-1"></i> Delete
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="mt-5 pt-4 border-top">
    <h3 class="fw-bold mb-4">
      <i class="bi bi-chat-square-text-fill me-2" style="color: #764ba2"></i
      >{{ comments.length }} Comments
    </h3>
    <div class="d-flex flex-column gap-3">
      <div *ngFor="let comment of comments" class="p-3 comment-card">
        <div class="d-flex align-items-start">
          <img
            src="https://i.pravatar.cc/50?u={{ comment.email }}"
            class="rounded-circle me-3 shadow-sm"
            alt="avatar"
          />
          <div class="w-100">
            <div class="d-flex justify-content-between">
              <h6 class="fw-bold text-dark mb-0">{{ comment.name }}</h6>
              <small class="text-muted fst-italic">a few moments ago</small>
            </div>
            <a href="mailto:{{ comment.email }}" class="text-muted text-decoration-none small">{{
              comment.email
            }}</a>
            <p class="mb-0 mt-2">{{ comment.body }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="d-flex justify-content-center align-items-center" style="height: 80vh">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</ng-template>
